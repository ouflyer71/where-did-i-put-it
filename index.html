<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where Did I Put It</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f6f3f">
<style>
:root{--bg:#fff;--fg:#111;--card:#f2f2ee;--acc:#1f6f3f;--mut:#555}
body.dark{--bg:#121412;--fg:#f2f2f2;--card:#22261f;--acc:#4fbf78;--mut:#aaa}
*{box-sizing:border-box}body{margin:0;font:19px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:12px;max-width:700px;margin:auto}
h1{font-size:24px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
textarea,input[type=search],select{width:100%;font-size:20px;padding:12px;border:2px solid var(--mut);border-radius:10px;background:var(--bg);color:var(--fg)}

button.sec{background:var(--card);color:var(--fg);border:2px solid var(--mut)}
.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.row>*{flex:1}
section{background:var(--card);border-radius:14px;padding:12px;margin:12px 0}
.item{border-top:1px solid var(--mut);padding:10px 0;display:flex;gap:10px}.item img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.loc{color:var(--acc);font-weight:700}.meta{color:var(--mut);font-size:15px}.item .acts button{min-height:44px;font-size:16px;padding:6px 10px;margin:4px 4px 0 0}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{min-height:36px!important;font-size:15px!important;padding:4px 12px!important;border-radius:18px!important;background:var(--bg)!important;color:var(--fg)!important;border:2px solid var(--mut)!important}

.match{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--mut);cursor:pointer}.match img{width:72px;height:72px;object-fit:cover;border-radius:8px}
</style></head><body>
<div id="banner" style="display:none;background:#b3261e;color:#fff;padding:12px;border-radius:10px;font-weight:600"></div><div id="flash" style="display:none;position:fixed;bottom:16px;left:16px;right:16px;background:#1f6f3f;color:#fff;padding:14px;border-radius:10px;text-align:center;z-index:9"></div><h1>📍 Where Did I Put It <button class="sec" id="theme" aria-label="theme">🌓</button></h1>
<section id="recentBox" style="display:none"><b>Recently found</b> <a href="#" id="recentClear" style="float:right;font-size:14px">Clear</a><div id="recent"></div></section>
<section><b>Put something away</b>
<textarea id="entry" rows="2" placeholder="spare tractor fuse, red toolbox, top drawer, barn"></textarea>
<div class="row"><button id="micAdd" class="sec">🎤 Speak</button><label class="btn sec" style="color:var(--fg)">📷 Photo<input id="photo" type="file" accept="image/*" capture="environment" hidden></label><button id="save">Save</button></div>

<div class="row"><select id="place"><option value="">All places</option></select><select id="tagf"><option value="">All tags</option></select></div>
<div id="list"></div></section>
<section id="photoSec"><b>📷 Photos</b>
<div class="row"><label class="btn">🔎 Find by photo<input id="fphoto" type="file" accept="image/*" hidden></label><button class="sec" id="pToggle">🖼 Show photos</button></div>

<div id="pview" style="display:none"><input id="pq" type="search" placeholder="search photos by name, spot or tag"><div class="grid" id="pgrid"></div></div>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Photo" style="display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);color:#fff;overflow:auto;touch-action:pinch-zoom pan-x pan-y">
<button id="vClose" aria-label="Close photo" style="position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:31;font-size:24px;width:48px;height:48px;border-radius:24px;background:rgba(0,0,0,.6);color:#fff;border:1px solid #888">✕</button>
<div id="vBody" style="min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 10px 20px;box-sizing:border-box"><img id="vImg" alt="" style="max-width:100%;max-height:75vh;object-fit:contain;border-radius:8px;touch-action:pinch-zoom"><div id="vInfo" style="margin-top:12px;text-align:center;font-size:18px"></div></div></div>
<section class="row"><button class="sec" id="exp">⬇ Export backup</button><label class="btn sec" style="color:var(--fg)">⬆ Import<input id="imp" type="file" accept="application/json" hidden></label></section>
<script>
const KEY='wdipi.items',RKEY='wdipi.recent';let recent=[],items=[],photos=new Map(),pdb=null,pdbFail=false,pendingPhoto=null,mode='memory',idb=null;const mem={};
const $=id=>document.getElementById(id);
function banner(msg){try{const b=$('banner');b.textContent=msg;b.style.display=msg?'block':'none'}catch(e){}}
function lsOK(){try{const t='__t';localStorage.setItem(t,'1');localStorage.removeItem(t);return true}catch(e){return false}}
function kvGet(k){if(mode==='local'){try{return localStorage.getItem(k)}catch(e){}}return mem[k]??null}
function kvSet(k,v){mem[k]=v;if(mode==='local'){try{localStorage.setItem(k,v);return true}catch(e){banner('⚠️ Phone storage is full or blocked. Item saved for this session only. Export a backup!');return false}}
 if(mode==='idb'&&idb){try{const tx=idb.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.onerror=()=>banner('⚠️ Could not write to storage. Export a backup!')}catch(e){banner('⚠️ Storage error. Export a backup!')}}return true}
function store(){try{kvSet(KEY,JSON.stringify(items))}catch(e){banner('⚠️ Could not save to storage: '+e.message)}}
function openIDB(){return new Promise(res=>{try{if(!window.indexedDB)return res(null);const r=indexedDB.open('wdipi',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);setTimeout(()=>res(null),2000)}catch(e){res(null)}})}
function openPDB(){return new Promise(res=>{try{if(!window.indexedDB)return res(null);const r=indexedDB.open('wdipi-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);setTimeout(()=>res(null),2500)}catch(e){res(null)}})}
function pdbAll(){return new Promise(res=>{try{const st=pdb.transaction('p').objectStore('p'),out=new Map(),c=st.openCursor();c.onsuccess=()=>{const x=c.result;if(x){out.set(x.key,x.value);x.continue()}else res(out)};c.onerror=()=>res(out)}catch(e){res(new Map())}})}
function putPhoto(id,ph){photos.set(id,ph);if(!pdb){banner('⚠️ Photo storage is blocked here. This photo is kept for this session only. Open the app in Chrome or Safari to keep photos.');return}
 try{const tx=pdb.transaction('p','readwrite');tx.objectStore('p').put(ph,id);tx.onerror=()=>banner('⚠️ Could not store the photo (storage full or blocked). Export a backup!')}catch(e){banner('⚠️ Could not store the photo: '+e.message)}}
function dropPhoto(id){photos.delete(id);try{pdb&&pdb.transaction('p','readwrite').objectStore('p').delete(id)}catch(e){}}
function photoOf(i){const p=photos.get(i.id);return p?p.img:null}
// ---- on-device image features: average-hash + difference-hash, chroma histogram, 6x6 colour grid ----
function feat(img){const W=96,c=document.createElement('canvas');c.width=W;c.height=W;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0,W,W);const d=g.getImageData(0,0,W,W).data;
 const gray=(x,y)=>{const k=(y*W+x)*4;return .299*d[k]+.587*d[k+1]+.114*d[k+2]};
 const cell=(n,f)=>{const s=W/n,o=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++){let a=[0,0,0],m=0;for(let yy=Math.floor(y*s);yy<Math.floor((y+1)*s);yy++)for(let xx=Math.floor(x*s);xx<Math.floor((x+1)*s);xx++){const k=(yy*W+xx)*4;a[0]+=d[k];a[1]+=d[k+1];a[2]+=d[k+2];m++}o.push(a.map(v=>v/m))}return o};
 const g9=cell(9).map(a=>.299*a[0]+.587*a[1]+.114*a[2]);let dh='';for(let y=0;y<9;y++)for(let x=0;x<8;x++)dh+=g9[y*9+x]<g9[y*9+x+1]?1:0;
 const g8=cell(8).map(a=>.299*a[0]+.587*a[1]+.114*a[2]),av=g8.reduce((s,v)=>s+v,0)/64;let ah='';g8.forEach(v=>ah+=v>av?1:0);
 const h=new Array(64).fill(0);let n=0;for(let k=0;k<d.length;k+=4){const S=d[k]+d[k+1]+d[k+2]+1,r=d[k]/S,gg=d[k+1]/S,b=Math.max(d[k],d[k+1],d[k+2])/255;h[Math.min(7,r*12|0)*8+Math.min(7,gg*12|0)]+=1;n++}for(let i=0;i<64;i++)h[i]/=n;
 const cg=cell(6),mu=[0,1,2].map(ch=>cg.reduce((s,a)=>s+a[ch],0)/36),gv=[];cg.forEach(a=>a.forEach((v,ch)=>gv.push(v-mu[ch])));const nn=Math.hypot(...gv)||1;
 return{v:1,dh,ah,h,g:gv.map(x=>+(x/nn).toFixed(4))}}
function ham(a,b){let s=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])s++;return s/a.length}
function sim(a,b){const hd=1-ham(a.dh,b.dh),ha=1-ham(a.ah,b.ah);let hi=0;for(let i=0;i<64;i++)hi+=Math.min(a.h[i],b.h[i]);let co=0;for(let i=0;i<a.g.length;i++)co+=a.g[i]*b.g[i];co=(co+1)/2;
 const raw=.2*hd+.2*ha+.25*hi+.35*co;return Math.max(0,Math.min(1,(raw-.55)/.4))}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function readPhoto(file){const u=URL.createObjectURL(file);try{const img=await loadImg(u);const s=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return{img:c.toDataURL('image/jpeg',0.72),f:feat(c)}}finally{try{URL.revokeObjectURL(u)}catch(e){}}}
async function ensureFeat(id){const p=photos.get(id);if(p&&!p.f){try{p.f=feat(await loadImg(p.img));putPhoto(id,p)}catch(e){}}return p}
async function findByPhoto(file){$('pmatch').innerHTML='<p class="meta">Comparing on this phone…</p>';let q;try{q=await readPhoto(file)}catch(e){$('pmatch').innerHTML='<p class="meta">Could not read that photo.</p>';return}
 const ids=items.filter(i=>photos.has(i.id)).map(i=>i.id);for(const id of ids)await ensureFeat(id);
 const r=ids.map(id=>[sim(q.f,photos.get(id).f),items.find(x=>x.id===id)]).sort((a,b)=>b[0]-a[0]).slice(0,3);
 if(!r.length){$('pmatch').innerHTML='<p class="meta">No saved items have photos yet.</p>';return}
  $('pmatch').innerHTML='<p class="meta">Best guess from how the pictures look (colours and shapes), not a sure thing. Check the spot.</p>'+r.map(([s,i])=>`<div class="match" data-id="${i.id}"><img src="${photoOf(i)}" alt="Photo of ${esc(i.item)}" data-v="${i.id}" style="cursor:zoom-in"><div><b>${esc(i.item)}</b>${i.tag?`<span class="tag">${esc(i.tag)}</span>`:''}<div class="loc">${esc(i.location||'(no location)')}</div><div class="meta">${Math.round(s*100)}% match · ${lab(s)}</div></div></div>`).join('')}
const lab=s=>s>=.75?'strong':s>=.5?'possible':'weak';
function tags(){const t=new Set(['garage','shop','kitchen']);items.forEach(i=>i.tag&&t.add(i.tag));return[...t]}
function chips(box,input){box.innerHTML=tags().map(t=>`<button type="button" class="chip" data-t="${esc(t)}">${esc(t)}</button>`).join('');box.onclick=e=>{const b=e.target.closest('.chip');if(b){input.value=b.dataset.t}}}
function renderPhotos(){const q=$('pq').value.trim(),ps=items.filter(i=>photos.has(i.id));const r=q?ps.filter(i=>score(i,q)>0):ps;
 $('pgrid').innerHTML=r.length?r.map(i=>`<div class="card" data-id="${i.id}"><img src="${photoOf(i)}" alt="Photo of ${esc(i.item)}" data-v="${i.id}" style="cursor:zoom-in"><div><b>${esc(i.item)}</b>${i.tag?`<span class="tag">${esc(i.tag)}</span>`:''}<div class="loc">${esc(i.location||'')}</div></div></div>`).join(''):'<p class="meta">No photos'+(q?' match.':' yet. Add one with 📷 Photo when you save.')+'</p>'}
function idbGet(k){return new Promise(res=>{try{const q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function parse(j){try{const a=JSON.parse(j||'[]');return Array.isArray(a)?norm(a):[]}catch(e){return[]}}
function norm(a){if(a.some(i=>typeof i!=='object'||!i))return a;a.forEach(i=>{i.history=i.history||[]});if(a.some(i=>typeof i.order!=='number')){a.sort((x,y)=>(y.ts||0)-(x.ts||0));a.forEach((i,n)=>i.order=n)}return a.sort((x,y)=>x.order-y.order)}
function renum(){items.forEach((i,n)=>i.order=n)}
async function initStorage(){pdb=await openPDB();if(pdb)photos=await pdbAll();if(lsOK()){mode='local';items=parse(kvGet(KEY));recent=parse(kvGet(RKEY)).filter(x=>typeof x==='string')}else{idb=await openIDB();if(idb){mode='idb';const prior=items;items=parse(await idbGet(KEY));recent=parse(await idbGet(RKEY)).filter(x=>typeof x==='string');prior.forEach(p=>{if(!items.some(i=>i.id===p.id))items.unshift(p)});if(prior.length)store();banner('')}
 else{mode='memory';banner('⚠️ This viewer blocks storage — items will be lost when you close it. Open this page in Chrome or Safari to keep them.')}}let mig=false;items.forEach(i=>{if(i.photo){if(!photos.has(i.id))putPhoto(i.id,{img:i.photo});if(pdb){delete i.photo;mig=true}}});if(mig)store();
 if(!pdb&&mode!=='memory')banner('⚠️ Photo storage is blocked in this browser. Photos will only last this session.');render()}
function ask(fn,...a){try{return fn.apply(window,a)}catch(e){return null}}
function split(t){t=t.trim();let i=t.indexOf(',');if(i>0)return{item:t.slice(0,i).trim(),location:t.slice(i+1).trim()};
 const m=t.match(/^(.+?)\s+(?:is\s+|are\s+)?(in|on|at|under|inside|behind)\s+(.+)$/i);return m?{item:m[1].trim(),location:(m[2]+' '+m[3]).trim()}:{item:t,location:''}}
function placeOf(loc){const s=loc.split(/,|\b(?:in|on|at|under|of|inside|behind)\b/i).map(x=>x.trim()).filter(Boolean);let p=(s[s.length-1]||'').toLowerCase().replace(/^(the|my|a)\s+/,'');return p||'unsorted'}
const FILL=new Set('where where\'s wheres whered where\'d is are was did i put my the a an find it at in on under of to that those these have left'.split(' '));
function words(s){return s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(w=>w&&!FILL.has(w)).map(w=>w.replace(/'s$/,'').replace(/s$/,''))}
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function score(it,q){const qw=words(q);if(!qw.length)return 1;const hw=words([it.item,it.location,it.text,it.tag||''].join(' '));let s=0;
 for(const w of qw){let best=0;for(const h of hw){if(h===w)best=Math.max(best,3);else if(h.startsWith(w)||w.startsWith(h)&&h.length>2)best=Math.max(best,2);else if(w.length>3&&lev(w,h)<=1+(w.length>6))best=Math.max(best,1)}s+=best}return s}
function search(q){return items.map(it=>[score(it,q),it]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]||b[1].ts-a[1].ts).map(x=>x[1])}
function add(text,photo,tag){if(!text.trim())return null;const p=split(text);const it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),...p,text:text.trim(),tag:(tag||'').trim().toLowerCase(),ts:Date.now(),history:[]};if(photo)putPhoto(it.id,photo);items.unshift(it);renum();store();render();return it}
function move(id,newLoc){const it=items.find(x=>x.id===id);if(!it||!newLoc)return;it.history.push({location:it.location,ts:it.ts});it.location=newLoc.trim();it.ts=Date.now();store();render()}
function edit(id,text){const it=items.find(x=>x.id===id);if(!it||!text)return;Object.assign(it,split(text),{text:text.trim()});store();render()}
let undoBuf=null;
function del(id){const n=items.findIndex(x=>x.id===id);if(n<0)return;if(undoBuf&&undoBuf.pend)dropPhoto(undoBuf.it.id);undoBuf={pend:photos.has(id),it:items[n],n,ri:recent.indexOf(id)};if(undoBuf.ri>=0){recent.splice(undoBuf.ri,1);storeRecent()}items.splice(n,1);renum();store();editing=null;render();flash('🗑 Deleted: '+undoBuf.it.item,{label:'Undo',fn:undo},6000);const ub=undoBuf;setTimeout(()=>{if(ub.pend&&!items.some(x=>x.id===ub.it.id)){dropPhoto(ub.it.id);ub.pend=false}},6500)}
function undo(){if(!undoBuf)return;items.splice(Math.min(undoBuf.n,items.length),0,undoBuf.it);undoBuf.pend=false;if(undoBuf.ri>=0){recent.splice(undoBuf.ri,0,undoBuf.it.id);storeRecent()}undoBuf=null;renum();store();render();flash('↩ Restored')}
function reorder(id,to){const n=items.findIndex(x=>x.id===id);if(n<0)return;to=Math.max(0,Math.min(items.length-1,to));if(to===n)return;const[it]=items.splice(n,1);items.splice(to,0,it);renum();store();render()}
function saveEdit(id,item,loc,tag){const it=items.find(x=>x.id===id);if(!it||!item.trim())return;if(tag!==undefined)it.tag=tag.trim().toLowerCase();if(editPhoto&&editPhoto.id===id){putPhoto(id,editPhoto.ph)}editPhoto=null;item=item.trim();loc=loc.trim();if(loc!==it.location&&it.location){it.history.push({location:it.location,ts:it.ts});it.ts=Date.now()}it.item=item;it.location=loc;it.text=loc?item+', '+loc:item;editing=null;store();render();flash('✅ Updated: '+item)}
let editing=null,editPhoto=null;
function storeRecent(){try{kvSet(RKEY,JSON.stringify(recent))}catch(e){}}
function openViewer(id){const it=items.find(x=>x.id===id),src=it&&photoOf(it);if(!src)return;$('vImg').src=src;$('vImg').alt='Photo of '+it.item;
 $('vInfo').innerHTML=`<b>${esc(it.item)}</b>${it.tag?` <span class="tag">${esc(it.tag)}</span>`:''}<div class="loc" style="color:#ddd">📍 ${esc(it.location||'(no location)')}</div>`;
 $('viewer').style.display='block';$('viewer').dataset.id=id;document.body.style.overflow='hidden';if(!(history.state&&history.state.viewer))history.pushState({viewer:1},'');$('vClose').focus()}
function closeViewer(fromPop){if($('viewer').style.display==='none')return;$('viewer').style.display='none';$('vImg').src='';document.body.style.overflow='';if(!fromPop&&history.state&&history.state.viewer)history.back()}
document.addEventListener('click',e=>{const t=e.target.closest('img[data-v]');if(!t||t.closest('#viewer'))return;e.preventDefault();e.stopPropagation();found(t.dataset.v);openViewer(t.dataset.v)},true);
addEventListener('popstate',()=>closeViewer(true));addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});
function found(id){const it=items.find(x=>x.id===id);if(!it)return;recent=[id,...recent.filter(x=>x!==id)].slice(0,8);storeRecent();renderRecent();flash('📍 '+it.item+' → '+(it.location||'(no location)'))}
function renderRecent(){const box=$('recentBox');const r=recent.map(id=>items.find(x=>x.id===id)).filter(Boolean);
 box.style.display=(!r.length||$('q').value.trim()||$('place').value||$('tagf').value)?'none':'block';
 $('recent').innerHTML=r.map(i=>`<div class="ritem" data-id="${i.id}" style="padding:6px 0;cursor:pointer">${photoOf(i)?`<img src="${photoOf(i)}" alt="Photo of ${esc(i.item)}" data-v="${i.id}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:8px;cursor:zoom-in">`:''}<b>${esc(i.item)}</b> — <span class="loc">${esc(i.location||'(no location)')}</span></div>`).join('')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){const sel=$('place'),cur=sel.value,places=[...new Set(items.map(i=>placeOf(i.location)))].sort();
 sel.innerHTML='<option value="">All places</option>'+places.map(p=>`<option ${p===cur?'selected':''}>${esc(p)}</option>`).join('');
 const tf=$('tagf'),tcur=tf.value;tf.innerHTML='<option value="">All tags</option>'+[...new Set(items.map(i=>i.tag).filter(Boolean))].sort().map(t=>`<option ${t===tcur?'selected':''}>${esc(t)}</option>`).join('');
 const filtered=!!($('q').value.trim()||sel.value||tf.value);let r=$('q').value.trim()?search($('q').value):items.slice();if(sel.value)r=r.filter(i=>placeOf(i.location)===sel.value);if(tf.value)r=r.filter(i=>i.tag===tf.value);if(filtered)editing=null;
 $('list').innerHTML=r.length?r.slice(0,100).map(i=>editing===i.id?`<div class="item" data-id="${i.id}"><div style="flex:1"><input class="e-item" value="${esc(i.item)}" aria-label="item" style="width:100%;margin-bottom:6px"><input class="e-loc" value="${esc(i.location)}" placeholder="location" aria-label="location" style="width:100%;margin-bottom:6px"><input class="e-tag txt" value="${esc(i.tag||'')}" placeholder="room or spot tag" aria-label="tag"><div class="chips e-chips"></div>${photoOf(i)?`<img src="${photoOf(i)}" alt="" style="width:80px;height:80px;object-fit:cover;border-radius:8px">`:''}<label class="btn sec" style="color:var(--fg);min-height:44px;font-size:16px">📷 ${photoOf(i)?'Change':'Add'} photo<input class="e-photo" type="file" accept="image/*" capture="environment" hidden></label><div class="acts"><button data-a="esave">Save</button><button class="sec" data-a="ecancel">Cancel</button><button class="sec" data-a="del">Delete</button></div></div></div>`:
 `<div class="item" data-id="${i.id}">${filtered?'':'<span class="grip" title="Drag to reorder" style="touch-action:none;cursor:grab;padding:4px 6px;font-size:22px;user-select:none">⠿</span>'}${photoOf(i)?`<img src="${photoOf(i)}" alt="Photo of ${esc(i.item)}" data-v="${i.id}" style="cursor:zoom-in">`:''}<div style="flex:1" data-a="${filtered?'found':'open'}"><div><b>${esc(i.item)}</b>${i.tag?`<span class="tag">${esc(i.tag)}</span>`:''}</div><div class="loc">${esc(i.location||'(no location)')}</div><div class="meta">${new Date(i.ts).toLocaleString()}${i.history.length?' · moved '+i.history.length+'×, was: '+esc(i.history[i.history.length-1].location):''}</div>${filtered?'':'<div class="acts"><button class="sec" data-a="edit">Edit</button><button class="sec" data-a="up" aria-label="move up">▲</button><button class="sec" data-a="down" aria-label="move down">▼</button><button class="sec" data-a="del">Delete</button></div>'}</div></div>`).join(''):'<p class="meta">Nothing found.</p>';
 renderRecent();chips($('tagChips'),$('tag'));if($('pview').style.display!=='none')renderPhotos();const ec=$('list').querySelector('.e-chips');if(ec)chips(ec,$('list').querySelector('.e-tag'));if(editing){const f=$('list').querySelector('.e-item');if(f&&document.activeElement!==f)f.focus()}}
$('vClose').onclick=()=>closeViewer();$('viewer').onclick=e=>{if(e.target.id==='viewer'||e.target.id==='vBody')closeViewer()};
$('list').onclick=e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,row=el.closest('.item');if(!row)return;const id=row.dataset.id,n=items.findIndex(x=>x.id===id);
 if(a==='found')found(id);else if(a==='del')del(id);else if(a==='edit'||a==='open'){editing=id;render()}else if(a==='ecancel'){editing=null;render()}
 else if(a==='esave')saveEdit(id,row.querySelector('.e-item').value,row.querySelector('.e-loc').value,row.querySelector('.e-tag').value);
 else if(a==='up')reorder(id,n-1);else if(a==='down')reorder(id,n+1)};
$('list').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.e-item,.e-loc,.e-tag')){const row=e.target.closest('.item');saveEdit(row.dataset.id,row.querySelector('.e-item').value,row.querySelector('.e-loc').value,row.querySelector('.e-tag').value)}if(e.key==='Escape'){editing=null;render()}});
$('list').addEventListener('change',async e=>{if(!e.target.matches('.e-photo'))return;const f=e.target.files&&e.target.files[0];if(!f)return;const row=e.target.closest('.item');try{editPhoto={id:row.dataset.id,ph:await readPhoto(f)};const im=row.querySelector('img');if(im)im.src=editPhoto.ph.img;else e.target.closest('label').insertAdjacentHTML('beforebegin',`<img src="${editPhoto.ph.img}" alt="" style="width:80px;height:80px;object-fit:cover;border-radius:8px">`);flash('📷 Photo ready. Tap Save to keep it.')}catch(x){banner('Could not read that photo.')}});
let drag=null;
$('list').addEventListener('pointerdown',e=>{const g=e.target.closest('.grip');if(!g)return;e.preventDefault();const row=g.closest('.item');drag={id:row.dataset.id,row,y:e.clientY};row.style.opacity='.6';row.style.position='relative';row.style.zIndex=5;try{g.setPointerCapture(e.pointerId)}catch(x){}});
$('list').addEventListener('pointermove',e=>{if(!drag)return;drag.row.style.transform=`translateY(${e.clientY-drag.y}px)`});
function endDrag(e){if(!drag)return;const d=drag;drag=null;d.row.style.transform='';d.row.style.opacity='';const rows=[...$('list').querySelectorAll('.item')].filter(r=>r!==d.row);let to=rows.length;for(let k=0;k<rows.length;k++){const b=rows[k].getBoundingClientRect();if(e.clientY<b.top+b.height/2){to=k;break}}
 const target=to<rows.length?items.findIndex(x=>x.id===rows[to].dataset.id):items.length;const from=items.findIndex(x=>x.id===d.id);reorder(d.id,target>from?target-1:target);render()}
$('list').addEventListener('pointerup',endDrag);$('list').addEventListener('pointercancel',e=>{if(drag){drag.row.style.transform='';drag.row.style.opacity='';drag=null}});
function doSave(){try{const t=$('entry').value;if(!t.trim()){banner('Type or say what you put away first.');return}
 let it;const tg=$('tag').value;try{it=add(t,pendingPhoto,tg)}catch(e){it=add(t,null,tg)}
 if(it){$('entry').value='';$('tag').value='';pendingPhoto=null;$('prev').style.display='none';try{$('photo').value=''}catch(e){}flash('✅ Saved: '+it.item)}}catch(e){banner('⚠️ Save error: '+e.message)}}
function flash(m,act,ms){const f=$('flash');f.textContent=m;if(act){const b=document.createElement('button');b.id='undo';b.textContent=act.label;b.style.cssText='margin-left:12px;background:#fff;color:#1f6f3f;padding:6px 14px;border-radius:8px;border:0;font-weight:700';b.onclick=()=>{f.style.display='none';act.fn()};f.appendChild(b)}f.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>f.style.display='none',ms||2500)}
$('save').onclick=doSave;$('entry').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSave()}});
$('q').oninput=render;$('place').onchange=render;$('tagf').onchange=render;$('pq').oninput=renderPhotos;
$('pToggle').onclick=()=>{const v=$('pview'),show=v.style.display==='none';v.style.display=show?'block':'none';$('pToggle').textContent=show?'🖼 Hide photos':'🖼 Show photos';if(show)renderPhotos()};
$('pgrid').onclick=e=>{const c=e.target.closest('.card');if(c)found(c.dataset.id)};$('pmatch').onclick=e=>{const m=e.target.closest('.match');if(m)found(m.dataset.id)};
$('fphoto').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)findByPhoto(f);e.target.value=''};
$('photo').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{pendingPhoto=await readPhoto(f);$('prev').src=pendingPhoto.img;$('prev').style.display='block'}catch(x){pendingPhoto=null;banner('Could not read that photo. You can still save without it.')}};
function mic(target,after){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const tip='🎤 Voice is not available here. Tap the text box and use the microphone key on your phone keyboard instead.';
 if(!SR){banner(tip);target.focus();return}
 try{const r=new SR();r.lang='en-US';r.onresult=e=>{target.value=e.results[0][0].transcript;banner('');after&&after()};r.onerror=e=>{banner(e.error==='not-allowed'?'🎤 Mic permission denied. Allow the microphone for this site, or use the keyboard mic.':tip);target.focus()};r.start();flash('🎤 Listening…')}catch(e){banner(tip);target.focus()}}
$('micAdd').onclick=()=>mic($('entry'));$('micFind').onclick=()=>mic($('q'),()=>{render();const t=$('list').querySelector('.item');if(t)found(t.dataset.id)});
$('recent').onclick=e=>{const r=e.target.closest('.ritem');if(r)found(r.dataset.id)};$('recentClear').onclick=e=>{e.preventDefault();recent=[];storeRecent();renderRecent()};
function exportData(){const ph={};photos.forEach((v,k)=>{if(items.some(i=>i.id===k))ph[k]=v.img});return JSON.stringify({app:'wdipi',version:2,exported:Date.now(),items,photos:ph})}
function importData(json){const d=JSON.parse(json),arr=Array.isArray(d)?d:d.items;if(!Array.isArray(arr))throw Error('bad file');const ids=new Set(items.map(i=>i.id));arr.forEach(i=>{if(i&&i.id&&!ids.has(i.id)){i.history=i.history||[];const im=(d.photos&&d.photos[i.id])||i.photo;delete i.photo;if(im)putPhoto(i.id,{img:im});items.push(i)}});renum();store();render();return arr.length}
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([exportData()],{type:'application/json'}));a.download='where-did-i-put-it-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{flash('Imported '+importData(t)+' items')}catch(x){banner('Could not read that backup')}})};
let th=null;try{th=localStorage.getItem('wdipi.theme')}catch(e){}if(th==='dark'||(!th&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.body.classList.add('dark');
$('theme').onclick=()=>{document.body.classList.toggle('dark');try{localStorage.setItem('wdipi.theme',document.body.classList.contains('dark')?'dark':'light')}catch(e){}};
try{if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
window.app={get items(){return items},get mode(){return mode},exportData,importData,reorder,sim,get photos(){return photos},split,search,ready:null};render();window.app.ready=initStorage();
</script>
</body></html>
