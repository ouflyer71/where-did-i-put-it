<style>

</style></head><body>
<div id="banner" style="display:none;background:#b3261e;color:#fff;padding:12px;border-radius:10px;font-weight:600"></div><div id="flash" style="display:none;position:fixed;bottom:16px;left:16px;right:16px;background:#1f6f3f;color:#fff;padding:14px;border-radius:10px;text-align:center;z-index:9"></div><h1>📍 Where Did I Put It <button class="sec" id="theme" aria-label="theme">🌓</button></h1>

<p class="meta" style="margin:0 0 8px"><label style="text-decoration:underline;cursor:pointer">🔎 Check a backup file<input id="chk" type="file" accept=".json,.txt,application/json,text/plain,*/*" hidden></label> <span id="chkRes"></span></p>
<script>
const KEY='wdipi.items',RKEY='wdipi.recent';let recent=[],items=[],photos=new Map(),pdb=null,pdbFail=false,pendingPhoto=null,mode='memory',idb=null;const mem={};
const $=id=>document.getElementById(id);
function banner(msg){try{const b=$('banner');b.textContent=msg;b.style.display=msg?'block':'none'}catch(e){}}
function lsOK(){try{const t='__t';localStorage.setItem(t,'1');localStorage.removeItem(t);return true}catch(e){return false}}
function kvGet(k){if(mode==='local'){try{return localStorage.getItem(k)}catch(e){}}return mem[k]??null}
function kvSet(k,v){mem[k]=v;if(mode==='local'){try{localStorage.setItem(k,v);return true}catch(e){banner('⚠️ Phone storage is full or blocked. Item saved for this session only. Export a backup!');return false}}
 if(mode==='idb'&&idb){try{const tx=idb.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.onerror=()=>banner('⚠️ Could not write to storage. Export a backup!')}catch(e){banner('⚠️ Storage error. Export a backup!')}}return true}
function store(){bkCache=null;clearTimeout(store.pb);store.pb=setTimeout(()=>{const go=()=>{try{buildBackup()}catch(e){}};window.requestIdleCallback?requestIdleCallback(go,{timeout:2000}):go()},400);if(bkOn){const b=bkGet();b.changes=(b.changes||0)+1;bkPut(b)}try{kvSet(KEY,JSON.stringify(items))}catch(e){banner('⚠️ Could not save to storage: '+e.message)}}
function openIDB(){return new Promise(res=>{try{if(!window.indexedDB)return res(null);const r=indexedDB.open('wdipi',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);setTimeout(()=>res(null),2000)}catch(e){res(null)}})}
function openPDB(){return new Promise(res=>{try{if(!window.indexedDB)return res(null);const r=indexedDB.open('wdipi-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);setTimeout(()=>res(null),2500)}catch(e){res(null)}})}
function pdbAll(){return new Promise(res=>{try{const st=pdb.transaction('p').objectStore('p'),out=new Map(),c=st.openCursor();c.onsuccess=()=>{const x=c.result;if(x){out.set(x.key,x.value);x.continue()}else res(out)};c.onerror=()=>res(out)}catch(e){res(new Map())}})}
function putPhoto(id,ph){bkCache=null;photos.set(id,ph);if(!pdb){banner('⚠️ Photo storage is blocked here. This photo is kept for this session only. Open the app in Chrome or Safari to keep photos.');return}
 try{const tx=pdb.transaction('p','readwrite');tx.objectStore('p').put(ph,id);tx.onerror=()=>banner('⚠️ Could not store the photo (storage full or blocked). Export a backup!')}catch(e){banner('⚠️ Could not store the photo: '+e.message)}}
function dropPhoto(id){photos.delete(id);try{pdb&&pdb.transaction('p','readwrite').objectStore('p').delete(id)}catch(e){}}
function photoOf(i){const p=photos.get(i.id);return p?p.img:null}
// ---- on-device image features: average-hash + difference-hash, chroma histogram, 6x6 colour grid ----
function feat(img){const W=96,c=document.createElement('canvas');c.width=W;c.height=W;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0,W,W);const d=g.getImageData(0,0,W,W).data;
 const gray=(x,y)=>{const k=(y*W+x)*4;return .299*d[k]+.587*d[k+1]+.114*d[k+2]};
 const cell=(n,f)=>{const s=W/n,o=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++){let a=[0,0,0],m=0;for(let yy=Math.floor(y*s);yy<Math.floor((y+1)*s);yy++)for(let xx=Math.floor(x*s);xx<Math.floor((x+1)*s);xx++){const k=(yy*W+xx)*4;a[0]+=d[k];a[1]+=d[k+1];a[2]+=d[k+2];m++}o.push(a.map(v=>v/m))}return o};
 const g9=cell(9).map(a=>.299*a[0]+.587*a[1]+.114*a[2]);let dh='';for(let y=0;y<9;y++)for(let x=0;x<8;x++)dh+=g9[y*9+x]<g9[y*9+x+1]?1:0;
 const g8=cell(8).map(a=>.299*a[0]+.587*a[1]+.114*a[2]),av=g8.reduce((s,v)=>s+v,0)/64;let ah='';g8.forEach(v=>ah+=v>av?1:0);
 const h=new Array(64).fill(0);let n=0;for(let k=0;k<d.length;k+=4){const S=d[k]+d[k+1]+d[k+2]+1,r=d[k]/S,gg=d[k+1]/S,b=Math.max(d[k],d[k+1],d[k+2])/255;h[Math.min(7,r*12|0)*8+Math.min(7,gg*12|0)]+=1;n++}for(let i=0;i<64;i++)h[i]/=n;
 const cg=cell(6),mu=[0,1,2].map(ch=>cg.reduce((s,a)=>s+a[ch],0)/36),gv=[];cg.forEach(a=>a.forEach((v,ch)=>gv.push(v-mu[ch])));const nn=Math.hypot(...gv)||1;
 return{v:1,dh,ah,h,g:gv.map(x=>+(x/nn).toFixed(4))}}
function ham(a,b){let s=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])s++;return s/a.length}
function sim(a,b){const hd=1-ham(a.dh,b.dh),ha=1-ham(a.ah,b.ah);let hi=0;for(let i=0;i<64;i++)hi+=Math.min(a.h[i],b.h[i]);let co=0;for(let i=0;i<a.g.length;i++)co+=a.g[i]*b.g[i];co=(co+1)/2;
 const raw=.2*hd+.2*ha+.25*hi+.35*co;return Math.max(0,Math.min(1,(raw-.55)/.4))}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function readPhoto(file){const u=URL.createObjectURL(file);try{const img=await loadImg(u);const s=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return{img:c.toDataURL('image/jpeg',0.72),f:feat(c)}}finally{try{URL.revokeObjectURL(u)}catch(e){}}}
async function ensureFeat(id){const p=photos.get(id);if(p&&!p.f){try{p.f=feat(await loadImg(p.img));putPhoto(id,p)}catch(e){}}return p}
async function findByPhoto(file){$('pmatch').innerHTML='<p class="meta">Comparing on this phone…</p>';let q;try{q=await readPhoto(file)}catch(e){$('pmatch').innerHTML='<p class="meta">Could not read that photo.</p>';return}
 const ids=items.filter(i=>photos.has(i.id)).map(i=>i.id);for(const id of ids)await ensureFeat(id);
 const r=ids.map(id=>[sim(q.f,photos.get(id).f),items.find(x=>x.id===id)]).sort((a,b)=>b[0]-a[0]).slice(0,3);
 if(!r.length){$('pmatch').innerHTML='<p class="meta">No saved items have photos yet.</p>';return}
  $('pmatch').innerHTML='<p class="meta">Best guess from how the pictures look (colours and shapes), not a sure thing. Check the spot.</p>'+r.map(([s,i])=>`<div class="match" data-id="${i.id}"><button type="button" class="thumb" data-v="${i.id}" aria-label="View photo of ${esc(i.item)}"><img src="${photoOf(i)}" alt="Photo of ${esc(i.item)}"></button><div><b>${esc(i.item)}</b>${i.tag?`<span class="tag">${esc(i.tag)}</span>`:''}<div class="loc">${esc(i.location||'(no location)')}</div><div class="meta">${Math.round(s*100)}% match · ${lab(s)}</div></div></div>`).join('')}
const lab=s=>s>=.75?'strong':s>=.5?'possible':'weak';
function tags(){const t=new Set(['garage','shop','kitchen']);items.forEach(i=>i.tag&&t.add(i.tag));return[...t]}
function chips(box,input){box.innerHTML=tags().map(t=>`<button type="button" class="chip" data-t="${esc(t)}">${esc(t)}</button>`).join('');box.onclick=e=>{const b=e.target.closest('.chip');if(b){input.value=b.dataset.t}}}
function renderPhotos(){const q=$('pq').value.trim(),ps=items.filter(i=>photos.has(i.id));const r=q?ps.filter(i=>score(i,q)>0):ps;
 $('pgrid').innerHTML=r.length?r.map(i=>`<div class="card" data-id="${i.id}"><button type="button" class="thumb" data-v="${i.id}" aria-label="View photo of ${esc(i.item)}"><img src="${photoOf(i)}" alt="Photo of ${esc(i.item)}"></button><div><b>${esc(i.item)}</b>${i.tag?`<span class="tag">${esc(i.tag)}</span>`:''}<div class="loc">${esc(i.location||'')}</div></div></div>`).join(''):'<p class="meta">No photos'+(q?' match.':' yet. Add one with 📷 Photo when you save.')+'</p>'}
function idbGet(k){return new Promise(res=>{try{const q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function parse(j){try{const a=JSON.parse(j||'[]');return Array.isArray(a)?norm(a):[]}catch(e){return[]}}
function norm(a){if(a.some(i=>typeof i!=='object'||!i))return a;a.forEach(i=>{i.history=i.history||[]});if(a.some(i=>typeof i.order!=='number')){a.sort((x,y)=>(y.ts||0)-(x.ts||0));a.forEach((i,n)=>i.order=n)}return a.sort((x,y)=>x.order-y.order)}
function renum(){items.forEach((i,n)=>i.order=n)}
async function initStorage(){pdb=await openPDB();if(pdb)photos=await pdbAll();if(lsOK()){mode='local';items=parse(kvGet(KEY));recent=parse(kvGet(RKEY)).filter(x=>typeof x==='string')}else{idb=await openIDB();if(idb){mode='idb';const prior=items;items=parse(await idbGet(KEY));recent=parse(await idbGet(RKEY)).filter(x=>typeof x==='string');prior.forEach(p=>{if(!items.some(i=>i.id===p.id))items.unshift(p)});if(prior.length)store();banner('')}
 else{mode='memory';banner('⚠️ This viewer blocks storage — items will be lost when you close it. Open this page in Chrome or Safari to keep them.')}}let mig=false;items.forEach(i=>{if(i.photo){if(!photos.has(i.id))putPhoto(i.id,{img:i.photo});if(pdb){delete i.photo;mig=true}}});if(mig)store();
 if(!pdb&&mode!=='memory')banner('⚠️ Photo storage is blocked in this browser. Photos will only last this session.');render()}
function ask(fn,...a){try{return fn.apply(window,a)}catch(e){return null}}
function split(t){t=t.trim();let i=t.indexOf(',');if(i>0)return{item:t.slice(0,i).trim(),location:t.slice(i+1).trim()};
 const m=t.match(/^(.+?)\s+(?:is\s+|are\s+)?(in|on|at|under|inside|behind)\s+(.+)$/i);return m?{item:m[1].trim(),location:(m[2]+' '+m[3]).trim()}:{item:t,location:''}}
function placeOf(loc){const s=loc.split(/,|\b(?:in|on|at|under|of|inside|behind)\b/i).map(x=>x.trim()).filter(Boolean);let p=(s[s.length-1]||'').toLowerCase().replace(/^(the|my|a)\s+/,'');return p||'unsorted'}
const FILL=new Set('where where\'s wheres whered where\'d is are was did i put my the a an find it at in on under of to that those these have left'.split(' '));
function words(s){return s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(w=>w&&!FILL.has(w)).map(w=>w.replace(/'s$/,'').replace(/s$/,''))}
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
const flat=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
function dl(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i];for(let j=1;j<=n;j++)d[i][j]=i?0:j}
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
const sing=w=>w.length>4&&/(ss|x|ch|sh)es$/.test(w)?w.slice(0,-2):w.length>3&&/s$/.test(w)&&!/ss$/.test(w)?w.slice(0,-1):w;
const toks=s=>String(s||'').toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).map(w=>w.replace(/'s?$/,'')).filter(w=>w&&!FILL.has(w));
function wsc(q,h){if(q===h||sing(q)===sing(h))return 30;const a=q.length<=h.length?q:h,b=a===q?h:q;if(a.length>=3&&b.startsWith(a))return 20;if(a.length<3)return 0;const L=b.length,k=L>=7?2:L>=4?1:0;if(k&&Math.abs(q.length-h.length)<=k&&dl(q,h)<=k)return 10;return 0}
let closeIds=new Set();
function score(it,q){const fq=flat(q);if(!fq)return 1;const hay=flat([it.item,it.location,it.text,it.tag,it.notes].join(' \u0001 '));if(flat(it.item).includes(fq))return 1000;if(hay.includes(fq))return 900;
 const qw=toks(q).filter(w=>w.length>=3);if(!qw.length)return 0;const hw=toks([it.item,it.location,it.tag||''].join(' '));let s=0;for(const w of qw){let best=0;for(const h of hw)best=Math.max(best,wsc(w,h));s+=best}return s}
function search(q){const qn=toks(q).filter(w=>w.length>=3).length;const r=items.map(it=>[score(it,q),it]).filter(x=>x[0]>0);closeIds=new Set(r.filter(x=>x[0]<900&&x[0]<30*qn).map(x=>x[1].id));return r.sort((a,b)=>b[0]-a[0]||b[1].ts-a[1].ts).map(x=>x[1])}
function putOf(i){return i.put||(i.history&&i.history[0]&&i.history[0].ts)||i.ts||null}
function when(t){if(!t)return'';const d=new Date(t),n=new Date(),tm=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();const dd=(day(n)-day(d))/864e5;
